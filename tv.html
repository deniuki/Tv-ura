<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Box Multi-Stream Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.11.6/dist/shaka-player.compiled.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .top {
      background: #12161f;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }
    .ch-title { font-weight: 700; color: #38bdf8; }
    .controls { display: flex; gap: 8px; flex: 1; max-width: 650px; }
    .controls input {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid #2b3548;
      background: #090c11;
      color: #fff;
    }
    .controls button {
      padding: 7px 12px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .player-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      background: #000;
    }
    .log {
      background: #0b0e14;
      color: #94a3b8;
      padding: 6px 14px;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <div class="top">
    <div id="channelLabel" class="ch-title">Gati për kanal</div>
    <div class="controls">
      <input id="srcInput" type="url" placeholder="Ngjit linkun e stream-it..." />
      <button onclick="playManual()">Luaj</button>
      <button onclick="toggleFs()">Fullscreen</button>
    </div>
  </div>

  <div class="player-wrap">
    <video id="video" controls autoplay playsinline></video>
  </div>

  <div id="log" class="log">Në pritje të stream-it...</div>

  <script>
    const video = document.getElementById("video");
    const logEl = document.getElementById("log");
    const labelEl = document.getElementById("channelLabel");
    const srcInput = document.getElementById("srcInput");

    let hls = null;
    let shaka = null;

    function log(msg) {
      logEl.textContent = msg;
    }

    async function cleanupPlayers() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      if (shaka) {
        try { await shaka.destroy(); } catch {}
        shaka = null;
      }
      video.removeAttribute("src");
      video.load();
    }

    async function startStream(url, chName) {
      if (!url) return;
      srcInput.value = url;
      if (chName) labelEl.textContent = "Kanali: " + chName;
      await cleanupPlayers();

      const lower = url.toLowerCase();

      if (lower.includes(".mpd") && window.shaka && shaka.Player.isBrowserSupported()) {
        shaka = new shaka.Player();
        await shaka.attach(video);
        shaka.addEventListener("error", (e) => {
          log("Gabim Shaka/DASH: " + (e.detail?.message || "stream i papërkrahur ose i mbrojtur"));
        });
        try {
          await shaka.load(url);
          video.play().catch(() => {});
          log("Duke luajtur stream DASH (.mpd) me Shaka Player.");
        } catch (err) {
          log("Nuk u hap DASH stream-i (mund të kërkojë DRM/token ose CORS).");
        }
        return;
      }

      if (lower.includes(".m3u8") && window.Hls && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
          log("Duke luajtur stream HLS (.m3u8) me HLS.js.");
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            log("Gabim HLS: " + (data.details || "bllokim CORS, token me skadencë ose kodek i papërkrahur"));
          }
        });
        return;
      }

      if (video.canPlayType("application/vnd.apple.mpegurl") && lower.includes(".m3u8")) {
        video.src = url;
        video.play().catch(() => {});
        log("Duke luajtur HLS nativ.");
        return;
      }

      video.src = url;
      video.play().catch(() => {});
      log("Duke provuar riprodhimin direkt të stream-it.");
    }

    function playManual() {
      const val = srcInput.value.trim();
      if (!val) return;
      const u = new URL(window.location.href);
      u.searchParams.set("src", val);
      history.replaceState(null, "", u.toString());
      startStream(val, "Manual");
    }

    function toggleFs() {
      if (video.requestFullscreen) video.requestFullscreen();
    }

    const params = new URLSearchParams(window.location.search);
    const initialSrc = params.get("src");
    const initialCh = params.get("ch");
    if (initialSrc) {
      startStream(initialSrc, initialCh || "Kanal");
    }
  </script>
</body>
</html>
