<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Box Auto-Receiver</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.11.6/dist/shaka-player.compiled.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .bar {
      background: #12161f;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
    .ch-title { font-weight: 700; color: #38bdf8; }
    button {
      padding: 7px 14px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video { width: 100%; height: 100%; background: #000; }
    .log {
      background: #0b0e14;
      color: #94a3b8;
      padding: 6px 14px;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <div class="bar">
    <div id="channelLabel" class="ch-title">Në pritje të komandës nga telefoni...</div>
    <button onclick="toggleFs()">Fullscreen</button>
  </div>

  <div class="stage">
    <video id="video" controls autoplay playsinline></video>
  </div>

  <div id="log" class="log">I lidhur dhe duke pritur kanal...</div>

  <script>
    const FIREBASE_URL = "https://app-im-test-default-rtdb.europe-west1.firebasedatabase.app";

    const video = document.getElementById("video");
    const logEl = document.getElementById("log");
    const labelEl = document.getElementById("channelLabel");

    let hls = null;
    let shaka = null;
    let lastTs = 0;

    function log(msg) { logEl.textContent = msg; }

    async function cleanup() {
      if (hls) { hls.destroy(); hls = null; }
      if (shaka) { try { await shaka.destroy(); } catch {} shaka = null; }
      video.removeAttribute("src");
      video.load();
    }

    async function playStream(url, name) {
      await cleanup();
      if (!url) {
        labelEl.textContent = "Transmetimi u ndalua";
        log("Në pritje të kanalit të radhës...");
        return;
      }

      labelEl.textContent = "Kanali: " + (name || "Live");
      const lower = url.toLowerCase();

      if (lower.includes(".mpd") && window.shaka && shaka.Player.isBrowserSupported()) {
        shaka = new shaka.Player();
        await shaka.attach(video);
        try {
          await shaka.load(url);
          video.play().catch(() => {});
          log("Duke luajtur DASH (.mpd).");
        } catch {
          log("Gabim në hapjen e DASH (.mpd) - mund të jetë i mbrojtur me DRM/CORS.");
        }
        return;
      }

      if (lower.includes(".m3u8") && window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
          log("Duke luajtur HLS (.m3u8).");
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) log("Gabim HLS: " + data.details);
        });
        return;
      }

      video.src = url;
      video.play().catch(() => {});
      log("Duke luajtur stream direkt.");
    }

    async function checkCommands() {
      try {
        const res = await fetch(`${FIREBASE_URL}/activeChannel.json?t=${Date.now()}`);
        const data = await res.json();
        if (data && data.ts && data.ts !== lastTs) {
          lastTs = data.ts;
          playStream(data.url, data.name);
        }
      } catch {
        log("Duke pritur lidhjen me Firebase...");
      }
    }

    function toggleFs() {
      if (video.requestFullscreen) video.requestFullscreen();
    }

    setInterval(checkCommands, 1500);
    checkCommands();
  </script>
</body>
</html>
