<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telekomandë Live TV</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1017;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    .box {
      max-width: 600px;
      margin: 0 auto;
      background: #171c26;
      border: 1px solid #2a3346;
      border-radius: 14px;
      padding: 20px;
    }
    h1 { font-size: 1.2rem; margin-top: 0; }
    label { display: block; margin: 12px 0 6px; font-size: 0.9rem; color: #cbd5e1; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #364158;
      background: #0b0e14;
      color: #fff;
      font-size: 0.95rem;
    }
    .row { display: flex; gap: 10px; margin-top: 14px; }
    button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #16a34a;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button.alt { background: #2563eb; }
    button.stop { background: #dc2626; }
    .channels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
    .ch-btn {
      background: #1e293b;
      border: 1px solid #334155;
      font-weight: 600;
      text-align: left;
      padding: 12px;
    }
    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #0b0e14;
      font-size: 0.88rem;
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Telekomandë Live (Mobile → TV Box)</h1>

    <label for="chName">Emri i kanalit</label>
    <input id="chName" type="text" placeholder="p.sh. Kanali 1" />

    <label for="chUrl">Linku i stream-it (.m3u8, .mpd, .mp4)</label>
    <input id="chUrl" type="url" placeholder="https://.../playlist.m3u8" />

    <div class="row">
      <button onclick="sendToTv()">Dërgo Tani në TV Box</button>
      <button class="alt" onclick="saveChannel()">Ruaj Kanalin</button>
    </div>

    <div class="row">
      <button class="stop" onclick="stopTv()">Ndalo Transmetimin në TV</button>
    </div>

    <label>Kanalet e mia (klikim i shpejtë)</label>
    <div id="savedList" class="channels"></div>

    <div id="status" class="status">Gati për komandim.</div>
  </div>

  <script>
    const FIREBASE_URL = "https://app-im-test-default-rtdb.europe-west1.firebasedatabase.app/";
    const STORAGE_KEY = "tv_remote_saved_v2";

    function setStatus(msg, isError = false) {
      const el = document.getElementById("status");
      el.style.color = isError ? "#f87171" : "#4ade80";
      el.textContent = msg;
    }

    async function pushCommand(name, url) {
      try {
        const res = await fetch(`${FIREBASE_URL}/activeChannel.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: name || "Kanal",
            url: url || "",
            ts: Date.now()
          })
        });
        if (!res.ok) throw new Error("Gabim në dërgim");
        setStatus(url ? `U dërgua në TV Box: ${name}` : "Transmetimi u ndalua në TV Box.");
      } catch (err) {
        setStatus("Nuk u lidh me Firebase. Kontrollo linkun e databazës.", true);
      }
    }

    function sendToTv() {
      const name = document.getElementById("chName").value.trim() || "Kanal";
      const url = document.getElementById("chUrl").value.trim();
      if (!url) return setStatus("Vendos fillimisht linkun e kanalit.", true);
      pushCommand(name, url);
    }

    function stopTv() {
      pushCommand("", "");
    }

    function getChannels() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
      catch { return []; }
    }

    function saveChannel() {
      const name = document.getElementById("chName").value.trim() || "Kanal";
      const url = document.getElementById("chUrl").value.trim();
      if (!url) return setStatus("Vendos linkun para se ta ruash.", true);
      const list = getChannels().filter(c => c.url !== url);
      list.unshift({ name, url });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list.slice(0, 20)));
      renderChannels();
      setStatus(`U ruajt kanali: ${name}`);
    }

    function renderChannels() {
      const container = document.getElementById("savedList");
      const list = getChannels();
      container.innerHTML = "";
      if (!list.length) {
        container.innerHTML = "<span style='color:#94a3b8;font-size:0.85rem;'>Nuk ka kanale të ruajtura ende.</span>";
        return;
      }
      list.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "ch-btn";
        btn.textContent = item.name;
        btn.onclick = () => {
          document.getElementById("chName").value = item.name;
          document.getElementById("chUrl").value = item.url;
          pushCommand(item.name, item.url);
        };
        container.appendChild(btn);
      });
    }

    renderChannels();
  </script>
</body>
</html>
